<!DOCTYPE html>
<html lang="eng">
    <head>

        <title>Hello</title>

        <script>
            function hello(){
                let heading = document.querySelector('h1');
                if(heading.innerHTML ==='Hellowww!'){
                    heading.innerHTML = 'goodbye';
                } else{
                    heading.innerHTML ='Hellowww!';
                } 
            }
         </script>

  </head>



    <body>
        <h1>Hellowww!</h1>
        <button onclick="hello()" name="button">click here</button>
    </body>
</html>
