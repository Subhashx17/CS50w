<!DOCTYPE html>
<html lang="eng">
    <head>

        <title>Hello</title>

        <script>
            function hello(){
                document.querySelector('h1').innerHTML = 'goodbye'
                ///document.querySelector checks the elements on the page ,and innerHTML changes it
            }
         </script>

    </head>



    <body>
        <h1>Hellowww!</h1>
        <button onclick="hello()">click here</button>
    </body>
</html>
